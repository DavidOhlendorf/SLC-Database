
<svg xmlns="http://www.w3.org/2000/svg"
     width="24" height="24"
     viewBox="0 0 24 24"
     fill="none"
     stroke="currentColor"
     stroke-width="1"
     stroke-linecap="round"
     stroke-linejoin="round"
     class="flex-shrink-0"
     aria-hidden="true">

  {% if icon_type == "single_vertical" %}
    <circle cx="12" cy="4" r="2.7"/>
    <circle cx="12" cy="12" r="2.7"/>
    <circle cx="12" cy="20" r="2.7"/>
    <circle cx="12" cy="12" r="1.25"
            fill="currentColor" stroke="none"/>

  {% elif icon_type == "single_horizontal" %}
    <circle cx="4" cy="12" r="2.7"/>
    <circle cx="12" cy="12" r="2.7"/>
    <circle cx="20" cy="12" r="2.7"/>
    <circle cx="12" cy="12" r="1.25"
            fill="currentColor" stroke="none"/>

  {% elif icon_type == "multi_vertical" %}
    <rect x="9.25" y="1.25" width="5.5" height="5.5" rx=".5"/>
    <rect x="9.25" y="9.25" width="5.5" height="5.5" rx=".5"/>
    <rect x="9.25" y="17.25" width="5.5" height="5.5" rx=".5"/>
    <path d="M10.3 12 L11.55 13.1 L13.8 10.8
             M10.3 20 L11.55 21.1 L13.8 18.8"
          stroke-width="1.2"/>

  {% elif icon_type == "multi_horizontal" %}
    <rect x="1.25" y="9.25" width="5.5" height="5.5" rx=".5"/>
    <rect x="9.25" y="9.25" width="5.5" height="5.5" rx=".5"/>
    <rect x="17.25" y="9.25" width="5.5" height="5.5" rx=".5"/>
    <path d="M2.3 12 L3.55 13.1 L5.8 10.8
             M18.3 12 L19.55 13.1 L21.8 10.8"
          stroke-width="1.2"/>

  {% endif %}
</svg>
