{% load static %}

{% if request.user.is_authenticated %}
  <nav class="navbar shadow mb-4 navbar-expand-lg bg-body-tertiary">
    <div class="container-fluid">

      <!-- Logo -->
      <a class="navbar-brand" href="{% url 'search:search_landing' %}">
        <img src="{% static 'icons/slcDatabase.png' %}" style="height:40px;" alt="">
      </a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
              data-bs-target="#navbarNavDropdown" aria-controls="navbarNavDropdown"
              aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarNavDropdown">

        <!-- Linke Seite (Befragungsübersicht) -->
        <ul class="navbar-nav me-auto">
          <li class="nav-item">
            <a class="nav-link" href="{% url 'search:search_landing' %}">
            Suche
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="{% url 'waves:survey_list' %}">
            Befragungen
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="{% url 'pages:page_list' %}">
            Seiten
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="{% url 'questions:question_list' %}">
              Fragen
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="{% url 'variables:variable_list' %}">
              Variablen
            </a>
          </li>
        </ul>

        <!-- Rechte Seite: Benutzer-Menü -->
        <ul class="navbar-nav">

          <li class="nav-item dropdown">

            <!-- Dropdown-Button -->
            <button
              class="btn btn-outline-secondary btn-sm dropdown-toggle
                    d-inline-flex align-items-center gap-2"
              type="button"
              id="accountMenuDropdown"
              data-bs-toggle="dropdown"
              aria-expanded="false"
            >
              <i class="fa-regular fa-circle-user"></i>
              <span>{{ request.user.get_username }}</span>
            </button>

            <!-- Dropdown-Menü -->
            <ul class="dropdown-menu dropdown-menu-end"
                aria-labelledby="accountMenuDropdown">

              <!-- Persönlicher Bereich -->
              <li>
                <a class="dropdown-item"
                  href="{% url 'accounts:account_overview' %}">
                  <i class="fa-regular fa-user me-2 text-secondary"></i>
                  Mein Bereich
                </a>
              </li>

              <li><hr class="dropdown-divider"></li>

              <!-- Darstellung -->
              <li>
                <a class="dropdown-item"
                  href="{% url 'accounts:account_appearance' %}">
                  <i class="fa-solid fa-palette me-2 text-secondary"></i>
                  Darstellung
                </a>
              </li>

              <!-- Konto & Sicherheit -->
              <li>
                <a class="dropdown-item"
                  href="{% url 'accounts:account_security' %}">
                  <i class="fa-solid fa-shield-halved me-2 text-secondary"></i>
                  Konto &amp; Sicherheit
                </a>
              </li>

              <!-- Merklisten: späteres Feature -->
              <li>
                <span class="dropdown-item disabled"
                      aria-disabled="true"
                      title="Demnächst verfügbar">
                  <i class="fa-regular fa-bookmark me-2"></i>
                  Merklisten
                  <span class="small ms-2">(Demnächst)</span>
                </span>
              </li>

              <li><hr class="dropdown-divider"></li>

              <!-- Abmelden -->
              <li>
                <form action="{% url 'accounts:logout' %}"
                      method="post">
                  {% csrf_token %}
                  <button type="submit" class="dropdown-item">
                    <i class="fa-solid fa-right-from-bracket me-2 text-secondary"></i>
                    Abmelden
                  </button>
                </form>
              </li>

            </ul>

          </li>

        </ul>
      </div>
    </div>
  </nav>
{% endif %}
