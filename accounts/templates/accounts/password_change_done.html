{% extends "main.html" %}

{% block content %}

  <!-- Navigation -->
  <div class="mb-3">
    <a href="{% url 'accounts:account_security' %}"
       class="text-decoration-none text-secondary">
      <i class="fa-solid fa-arrow-left me-1"></i>
      Konto &amp; Sicherheit
    </a>
  </div>

  <!-- Überschrift -->
  <div class="mb-4">
    <h1 class="mb-1">Passwort geändert</h1>
    <p class="text-muted mb-0">
      Die Änderung deiner Zugangsdaten war erfolgreich.
    </p>
  </div>

  <div class="row">
    <div class="col-12 col-lg-8 col-xl-7">

      <div class="card shadow-sm">
        <div class="card-body p-4">

          <div class="d-flex align-items-start gap-3">

            <i class="fa-solid fa-circle-check fs-3 text-success"></i>

            <div>
              <h2 class="h5 mb-2">
                Dein Passwort wurde erfolgreich geändert.
              </h2>

              <p class="text-muted mb-4">
                Du kannst dich ab sofort mit deinem neuen
                Passwort anmelden.
              </p>

              <a href="{% url 'accounts:account_security' %}"
                 class="btn btn-outline-secondary">
                <i class="fa-solid fa-arrow-left me-1"></i>
                Zurück zu Konto &amp; Sicherheit
              </a>
            </div>

          </div>

        </div>
      </div>

    </div>
  </div>

{% endblock %}
